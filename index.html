<!DOCTYPE html>
<html lang="de" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySentencesBuilder | TerraNova Engineering Lab</title>
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="sentenceBuilderApp()" x-init="initData()">
    <span lang="de" class="notranslate" translate="no">EasySentencesBuilder</span>

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 px-6 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-purple-300 font-semibold">TerraNova Engineering Lab</span>
                <h1 class="text-3xl font-extrabold text-white mt-1">EasySentencesBuilder 🇩🇪</h1>
                <p class="text-slate-400 text-sm mt-1">Interaktiver deutscher Satzbaukasten mit integrierter Grammatikprüfung.</p>
            </div>
            <div class="flex items-center gap-2">
                <button @click="speakSentence()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow flex items-center gap-2">
                    🔊 Auf Deutsch anhören
                </button>
                <button @click="clearWorkspace()" class="bg-rose-600/80 hover:bg-rose-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow">
                    🗑️ Leeren
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">

        <!-- WORKSPACE / SENTENCE CANVAS -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-purple-300">Mein Satz (Satzwerkstatt)</h2>
            
            <div class="min-h-[100px] bg-slate-950 border-2 border-dashed border-slate-700 rounded-xl p-4 flex flex-wrap items-center gap-2">
                <template x-if="workspace.length === 0">
                    <span class="text-slate-500 text-sm font-sans italic">Klicken Sie unten auf Wörter, um Ihren Satz zu bauen...</span>
                </template>

                <template x-for="(item, index) in workspace" :key="index">
                    <div class="flex items-center gap-1 bg-slate-800 border border-slate-600 text-white px-3 py-1.5 rounded-lg text-sm shadow-md animate-fade-in">
                        <span class="font-bold text-emerald-300" x-text="formatTokenDisplay(item, index)"></span>
                        <span class="text-[10px] opacity-60 font-mono" x-text="'(' + (item.category || item.type) + ')'"></span>
                        
                        <!-- Actions: Move Left, Move Right, Remove -->
                        <div class="flex items-center gap-1 ml-2 border-l border-slate-700 pl-2">
                            <button @click="moveToken(index, -1)" x-show="index > 0" class="hover:text-purple-300 text-xs">←</button>
                            <button @click="moveToken(index, 1)" x-show="index < workspace.length - 1" class="hover:text-purple-300 text-xs">→</button>
                            <button @click="removeToken(index)" class="hover:text-rose-400 text-xs ml-1">✕</button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Constructed Sentence & Grammar Feedback -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="text-xs text-slate-400 uppercase font-mono block mb-1">Generierter Satz:</span>
                    <p class="text-xl font-bold text-white font-mono" x-text="constructedSentence || '...'"></p>
                </div>
                
                <!-- Grammar Status Badge -->
                <div class="px-4 py-2 rounded-lg text-xs font-semibold shadow-inner"
                     :class="grammarCheck.valid ? 'bg-emerald-950/80 border border-emerald-600 text-emerald-300' : 'bg-amber-950/80 border border-amber-600 text-amber-300'">
                    <span x-text="grammarCheck.message"></span>
                </div>
            </div>
        </section>

        <!-- WORD BANK TABS & SEARCH -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center border-b border-slate-700 pb-4">
                <!-- Search -->
                <div class="relative w-full md:w-80">
                    <input type="text" x-model="searchQuery" placeholder="Wörter suchen (Deutsch / Englisch)..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-400 transition">
                </div>

                <!-- Active Dataset Tab Selector -->
                <div class="flex flex-wrap bg-slate-900 p-1.5 rounded-xl border border-slate-700 gap-1">
                    <button @click="activeTab = 'verbs'" :class="activeTab === 'verbs' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs font-medium transition">Verben</button>
                    <button @click="activeTab = 'grammar'" :class="activeTab === 'grammar' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs font-medium transition">Konnektoren & Grammatik</button>
                    <button @click="activeTab = 'nouns'" :class="activeTab === 'nouns' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs font-medium transition">Nomen</button>
                    <button @click="activeTab = 'articles_pronouns'" :class="activeTab === 'articles_pronouns' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs font-medium transition">Artikel & Pronomen</button>
                </div>
            </div>

            <!-- WORD CARDS GRID -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-[500px] overflow-y-auto pr-2">
                <template x-for="item in filteredItems" :key="(item.id || item.german) + '-' + activeTab">
                    <div @click="selectItem(item)" 
                         class="bg-slate-900/90 hover:bg-slate-700/80 border border-slate-700/80 rounded-xl p-3.5 transition cursor-pointer shadow hover:border-purple-400 flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-start gap-1">
                                <span class="font-bold text-white text-sm group-hover:text-purple-300" x-text="item.german"></span>
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-purple-300" x-text="item.category || item.type"></span>
                            </div>
                            <p class="text-xs text-slate-400 mt-1" x-text="item.english"></p>
                        </div>
                        <span class="text-[10px] text-emerald-400 font-mono mt-3 text-right group-hover:underline">+ Hinzufügen</span>
                    </div>
                </template>
            </div>
        </section>

    </main>

    <!-- VERB CONJUGATION MODAL -->
    <div x-show="showVerbModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-white">Verb konjugieren: <span class="text-purple-300" x-text="selectedVerb?.german"></span></h3>
                <button @click="showVerbModal = false" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <p class="text-xs text-slate-300">Wählen Sie die passende Form für Ihren Satz aus:</p>

            <div class="grid grid-cols-2 gap-2" x-if="selectedVerb?.conjugation">
                <button @click="addConjugatedVerb('ich', selectedVerb.conjugation.ich)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">ich</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.ich"></span>
                </button>
                <button @click="addConjugatedVerb('du', selectedVerb.conjugation.du)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">du</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.du"></span>
                </button>
                <button @click="addConjugatedVerb('er/sie/es', selectedVerb.conjugation.er_sie_es)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">er / sie / es</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.er_sie_es"></span>
                </button>
                <button @click="addConjugatedVerb('wir', selectedVerb.conjugation.wir)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">wir</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.wir"></span>
                </button>
                <button @click="addConjugatedVerb('ihr', selectedVerb.conjugation.ihr)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">ihr</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.ihr"></span>
                </button>
                <button @click="addConjugatedVerb('sie/Sie', selectedVerb.conjugation.sie_Sie)" class="bg-slate-900 hover:bg-purple-600 border border-slate-700 p-2.5 rounded-xl text-left transition">
                    <span class="text-[10px] text-slate-400 block font-mono">sie / Sie</span>
                    <span class="text-sm font-bold text-white" x-text="selectedVerb?.conjugation?.sie_Sie"></span>
                </button>
            </div>

            <button @click="addInfinitiveVerb()" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-medium py-2 rounded-xl transition mt-2">
                Infinitiv verwenden (<span x-text="selectedVerb?.german"></span>)
            </button>
        </div>
    </div>

    <!-- APP SCRIPT & INTEGRATED DATASETS -->

<!-- APP SCRIPT & INTEGRATED DATASETS -->
    <script>
        function sentenceBuilderApp() {
            return {
                activeTab: 'verbs',
                searchQuery: '',
                workspace: [],
                showVerbModal: false,
                selectedVerb: null,

                verbs: [],
                grammar: [],
                nouns: [],
                articles_pronouns: [],

                async initData() {
                    try {
                        let res = await fetch('./verbsconjugated.json');
                        if (res.ok) {
                            let rawVerbs = await res.json();
                            // Map JSON keys to match app expectations (verb -> german, translation -> english, present -> conjugation)
                            this.verbs = rawVerbs.map(v => ({
                                id: v.id,
                                german: v.verb || v.german,
                                english: v.translation || v.english,
                                type: v.type || "Regular / Irregular",
                                conjugation: v.present || v.conjugation
                            }));
                        }
                    } catch (e) {
                        console.log('Falling back to default verbs list:', e);
                        this.verbs = [
                            { id: 1, german: "sein", english: "to be", type: "Auxiliary / Irregular", conjugation: { ich: "bin", du: "bist", er_sie_es: "ist", wir: "sind", ihr: "seid", sie_Sie: "sind" } },
                            { id: 2, german: "haben", english: "to have", type: "Auxiliary / Irregular", conjugation: { ich: "habe", du: "hast", er_sie_es: "hat", wir: "haben", ihr: "habt", sie_Sie: "haben" } }
                        ];
                    }

                    // Default static datasets for grammar, nouns, and articles/pronouns
                    this.grammar = [
                        { id: 1, german: "und", english: "and", type: "Coordinating Conjunction" },
                        { id: 2, german: "aber", english: "but / however", type: "Coordinating Conjunction" },
                        { id: 6, german: "weil", english: "because (subordinating)", type: "Subordinating Conjunction" },
                        { id: 7, german: "dass", english: "that (subordinating)", type: "Subordinating Conjunction" },
                        { id: 21, german: "deshalb", english: "therefore / that is why", type: "Conjunctive Adverb" }
                    ];

                    this.nouns = [
                        { id: 1, german: "der Mann", english: "man", category: "Noun with Article" },
                        { id: 2, german: "die Frau", english: "woman", category: "Noun with Article" },
                        { id: 3, german: "das Kind", english: "child", category: "Noun with Article" }
                    ];

                    this.articles_pronouns = [
                        { id: 101, german: "der", english: "the (masc. nom.)", type: "Definite Article" },
                        { id: 201, german: "ich", english: "I", type: "Personal Pronoun" },
                        { id: 202, german: "du", english: "you (informal singular)", type: "Personal Pronoun" }
                    ];
                },

                get currentDataset() {
                    if (this.activeTab === 'verbs') return this.verbs;
                    if (this.activeTab === 'grammar') return this.grammar;
                    if (this.activeTab === 'nouns') return this.nouns;
                    if (this.activeTab === 'articles_pronouns') return this.articles_pronouns;
                    return [];
                },

                get filteredItems() {
                    let q = this.searchQuery.toLowerCase().trim();
                    if (!q) return this.currentDataset;
                    return this.currentDataset.filter(item => 
                        item.german.toLowerCase().includes(q) || 
                        item.english.toLowerCase().includes(q) ||
                        (item.category && item.category.toLowerCase().includes(q)) ||
                        (item.type && item.type.toLowerCase().includes(q))
                    );
                },

                selectItem(item) {
                    if (this.activeTab === 'verbs' && item.conjugation) {
                        this.selectedVerb = item;
                        this.showVerbModal = true;
                    } else {
                        this.workspace.push({
                            german: item.german,
                            english: item.english,
                            category: item.category || item.type,
                            originalItem: item
                        });
                    }
                },

                addConjugatedVerb(pronoun, form) {
                    this.workspace.push({
                        german: form,
                        english: `${this.selectedVerb.english} (${pronoun})`,
                        category: "Conjugated Verb",
                        isVerb: true,
                        pronoun: pronoun,
                        originalVerb: this.selectedVerb
                    });
                    this.showVerbModal = false;
                    this.selectedVerb = null;
                },

                addInfinitiveVerb() {
                    this.workspace.push({
                        german: this.selectedVerb.german,
                        english: this.selectedVerb.english,
                        category: "Infinitive Verb",
                        isVerb: true,
                        originalVerb: this.selectedVerb
                    });
                    this.showVerbModal = false;
                    this.selectedVerb = null;
                },

                removeToken(index) {
                    this.workspace.splice(index, 1);
                },

                moveToken(index, direction) {
                    let target = index + direction;
                    if (target >= 0 && target < this.workspace.length) {
                        let temp = this.workspace[index];
                        this.workspace[index] = this.workspace[target];
                        this.workspace[target] = temp;
                    }
                },

                clearWorkspace() {
                    this.workspace = [];
                },

                formatTokenDisplay(item, index) {
                    let text = item.german;
                    if (index === 0) {
                        text = text.charAt(0).toUpperCase() + text.slice(1);
                    }
                    return text;
                },

                get constructedSentence() {
                    if (this.workspace.length === 0) return '';
                    let str = this.workspace.map((item, idx) => this.formatTokenDisplay(item, idx)).join(' ');
                    if (!str.endsWith('.') && !str.endsWith('?') && !str.endsWith('!')) {
                        str += '.';
                    }
                    return str;
                },

                get grammarCheck() {
                    if (this.workspace.length < 2) {
                        return { valid: true, message: "Fügen Sie weitere Wörter hinzu..." };
                    }

                    let hasSubordinate = this.workspace.some(t => t.category === "Subordinating Conjunction");
                    let verbIndex = this.workspace.findIndex(t => t.isVerb);

                    if (hasSubordinate && verbIndex !== -1) {
                        if (verbIndex !== this.workspace.length - 1) {
                            return { valid: false, message: "⚠️ Nebensatz-Regel: Das Verb muss ganz am Ende stehen!" };
                        }
                    } else if (verbIndex !== -1 && verbIndex !== 1 && verbIndex !== 0) {
                        return { valid: false, message: "⚠️ V2-Regel: Im Hauptsatz steht das konjugierte Verb gewöhnlich an Position 2." };
                    }

                    return { valid: true, message: "✓ Grammatik sieht gut aus!" };
                },

                speakSentence() {
                    if (!this.constructedSentence) return;
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        let utterance = new SpeechSynthesisUtterance(this.constructedSentence);
                        utterance.lang = 'de-DE';
                        utterance.rate = 0.9;
                        window.speechSynthesis.speak(utterance);
                    }
                }
            }
        }
    </script>

    <!-- SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered successfully:', reg.scope))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
